<button class="menu-btn" type="button" aria-label="{{ i18n "menu" }}" aria-expanded="false" aria-controls="menu">
  <span></span><span></span><span></span>
</button>
<div class="menu" id="menu" role="dialog" aria-label="{{ i18n "menu" }}">
  <div class="menu-panel">
    <button class="menu-close" type="button" aria-label="{{ i18n "close" }}">&times;</button>
    <nav>
      <ul>
        {{- $page := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        {{- range .AllTranslations }}
          {{- if ne .Language.Lang site.Language.Lang }}
        <li class="lang"><a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">{{ .Language.Label }}</a></li>
          {{- end }}
        {{- end }}
      </ul>
    </nav>
  </div>
  <div class="menu-dim" data-close></div>
</div>
