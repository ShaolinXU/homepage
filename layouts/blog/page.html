{{ define "title" }}<p class="page-title"><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></p>{{ end }}
{{ define "main" }}
<article>
  <h2 class="post-title">{{ .Title }}</h2>
  <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ with .Params.tags }} · {{ delimit . " · " }}{{ end }}</p>
  {{ .Content }}
</article>
{{ end }}
