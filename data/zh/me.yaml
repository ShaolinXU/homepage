    org: 德国联邦水文研究所（Bundesanstalt für Gewässerkunde，BfG），U4 部门，德国科布伦茨
    start: 2026-02-01
    summary: |
      *FraGen：开发并应用基于 eDNA 的方法评估联邦水道中鱼类种群的遗传破碎化。*开发并验证一套非侵入式的 eDNA 框架，用于评估关键鱼类的遗传多样性与种群破碎化，并以此评价鱼道效果、支持水道管理。
      项目负责人（PI）：Nicole Scheifhacken 博士和 Sascha Krenek 博士。
